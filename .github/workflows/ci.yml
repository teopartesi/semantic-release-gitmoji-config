name: Quality

on:
  pull_request:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: npm token used to verify registry authentication
        required: true

permissions:
  contents: read

jobs:
  tokens:
    name: Verify release tokens
    # Actions secrets are unavailable to fork and Dependabot pull requests.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify GitHub authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --silent
          echo "GitHub repository authentication succeeded."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::error::NPM_TOKEN is missing. Configure the repository Actions secret."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org > /dev/null
          echo "npm registry authentication succeeded."

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.14.0
          - 24.18.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Validate package exports
        run: npm run lint:package

      - name: Inspect published files
        run: npm run pack:dry
